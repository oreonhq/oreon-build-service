<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dependencies - Oreon Build Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/style.css?v=4">
  <style>
    .deps-card {
      border-radius: 6px;
      box-shadow: none;
    }
    .deps-lead {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin: 0.25rem 0 0.85rem;
    }
    .deps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0.85rem;
      align-items: start;
    }
    .deps-filter-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem;
    }
    .deps-filter-box label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .deps-filter-list {
      max-height: 12rem;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      padding: 0.35rem 0.45rem;
      margin-top: 0.35rem;
    }
    .deps-actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .deps-status-row {
      margin-top: 0.6rem;
    }
    .deps-status-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.45rem;
    }
    .deps-summary {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .deps-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid #d4d4d8;
      background: #fff;
      color: #333;
    }
    .deps-chip.warn {
      background: #fff5f5;
      border-color: #fecaca;
      color: #9f1239;
    }
    .deps-codebox {
      width: 100%;
      max-width: none;
      min-height: 96px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #fbfbfc;
    }
    .deps-toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
      padding: 0.4rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fafafa;
    }
    .deps-toolbar label {
      color: var(--text-muted);
      font-size: 0.86rem;
    }
    .deps-table-wrap {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: auto;
      background: #fff;
    }
    .deps-table-wrap table th {
      position: sticky;
      top: 0;
      background: #fafafa;
      z-index: 1;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav></nav>
  </header>
  <main class="main">
    <section id="deps-login-gate" class="card deps-card" style="display:none;">
      <h2>Dependencies</h2>
      <p class="deps-lead">Log in to view the dependency graph.</p>
    </section>
    <div id="deps-authed-content" style="display:none;">
    <section class="card deps-card">
      <h2>Dependencies</h2>
      <p class="deps-lead">
        Scans all release and branch repos in R2, checks package dependency closure, and highlights missing requirements.
      </p>
      <div class="deps-grid">
        <div class="deps-filter-box">
          <label>Filter releases</label>
          <input id="filter-release-search" class="form-control" placeholder="Search releases...">
          <div id="filter-releases" class="deps-filter-list"></div>
        </div>
        <div class="deps-filter-box">
          <label>Filter branches</label>
          <input id="filter-branch-search" class="form-control" placeholder="Search branches...">
          <div id="filter-branches" class="deps-filter-list"></div>
        </div>
        <div class="deps-filter-box">
          <label>Filter packages and dependency names</label>
          <input id="filter-package-search" class="form-control" placeholder="Search package or requirement...">
          <div id="filter-packages" class="deps-filter-list"></div>
        </div>
      </div>
      <div class="deps-actions">
        <button type="button" class="btn" id="btn-deps-refresh">Refresh graph</button>
        <button type="button" class="btn" id="btn-select-all">Select all filters</button>
        <button type="button" class="btn" id="btn-select-none">Clear filters</button>
      </div>
      <div class="deps-status-row">
        <div id="deps-status" class="deps-status-text"></div>
        <div id="deps-summary" class="deps-summary"></div>
      </div>
      <div style="margin-top:0.75rem;">
        <label for="buildrequires-chain-output" style="display:block; font-size:0.9rem; color:var(--text-muted); margin-bottom:0.35rem;">
          BuildRequires build chain string
        </label>
        <textarea
          id="buildrequires-chain-output"
          class="form-control deps-codebox"
          rows="4"
          readonly
          placeholder="Generated from current filters. Format supports parallel groups with ':'"
        ></textarea>
        <div style="margin-top:0.45rem;">
          <button type="button" class="btn primary" id="btn-copy-buildrequires-chain">Copy buildrequires chain string</button>
        </div>
      </div>
      <div style="margin-top:0.75rem;">
        <label for="requires-chain-output" style="display:block; font-size:0.9rem; color:var(--text-muted); margin-bottom:0.35rem;">
          Requires install-time chain string
        </label>
        <textarea
          id="requires-chain-output"
          class="form-control deps-codebox"
          rows="4"
          readonly
          placeholder="Generated from current filters for missing install-time Requires dependencies"
        ></textarea>
        <div style="margin-top:0.45rem;">
          <button type="button" class="btn primary" id="btn-copy-requires-chain">Copy requires chain string</button>
        </div>
      </div>
    </section>

    <section class="card deps-card">
      <h3 style="margin-top:0;">Missing build dependencies</h3>
      <div class="deps-toolbar">
        <button type="button" class="btn" id="missing-prev">Prev</button>
        <span id="missing-page-info" class="deps-status-text" style="margin:0;">Page 1</span>
        <button type="button" class="btn" id="missing-next">Next</button>
        <label style="margin-left:0.5rem;">Per page</label>
        <select id="missing-page-size" class="form-control" style="width:6rem;">
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div id="missing-table" class="deps-table-wrap"></div>
    </section>

    <section class="card deps-card">
      <h3 style="margin-top:0;">Missing install-time dependencies</h3>
      <div class="deps-toolbar">
        <button type="button" class="btn" id="runtime-missing-prev">Prev</button>
        <span id="runtime-missing-page-info" class="deps-status-text" style="margin:0;">Page 1</span>
        <button type="button" class="btn" id="runtime-missing-next">Next</button>
        <label style="margin-left:0.5rem;">Per page</label>
        <select id="runtime-missing-page-size" class="form-control" style="width:6rem;">
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div id="runtime-missing-table" class="deps-table-wrap"></div>
    </section>

    <section class="card deps-card">
      <h3 style="margin-top:0;">Dependency graph edges</h3>
      <div class="deps-toolbar">
        <button type="button" class="btn" id="edges-prev">Prev</button>
        <span id="edges-page-info" class="deps-status-text" style="margin:0;">Page 1</span>
        <button type="button" class="btn" id="edges-next">Next</button>
        <label style="margin-left:0.5rem;">Per page</label>
        <select id="edges-page-size" class="form-control" style="width:6rem;">
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
        </select>
      </div>
      <div id="edges-table" class="deps-table-wrap"></div>
    </section>
    </div>
  </main>

  <script src="/static/app.js?v=13"></script>
  <script>
    (function() {
      var api = window.oreonApi;
      var depsGraphLoaded = false;
      var graph = null;
      var releaseSel = new Set();
      var branchSel = new Set();
      var packageSel = new Set();
      var packageUniverse = [];
      var neededUniverse = [];
      var missingPage = 1;
      var runtimeMissingPage = 1;
      var edgesPage = 1;

      function byId(id) { return document.getElementById(id); }
      function esc(s) {
        var d = document.createElement('div');
        d.textContent = String(s == null ? '' : s);
        return d.innerHTML;
      }

      function renderOptions(containerId, values, selectedSet, searchVal) {
        var box = byId(containerId);
        if (!box) return;
        var q = (searchVal || '').trim().toLowerCase();
        var shown = values.filter(function(v) { return !q || String(v).toLowerCase().indexOf(q) >= 0; });
        box.innerHTML = shown.map(function(v) {
          var checked = selectedSet.has(v) ? ' checked' : '';
          return '<label style="display:flex; gap:0.35rem; align-items:center; margin:0.15rem 0;">'
            + '<input type="checkbox" data-v="' + esc(v) + '"' + checked + '>'
            + '<span>' + esc(v) + '</span>'
            + '</label>';
        }).join('') || '<div style="color:var(--text-muted);">No matches</div>';
        box.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
          cb.addEventListener('change', function() {
            var v = cb.getAttribute('data-v');
            if (cb.checked) selectedSet.add(v);
            else selectedSet.delete(v);
            applyFilters();
          });
        });
      }

      function renderFilterBoxes() {
        if (!graph) return;
        var releaseText = (byId('filter-release-search').value || '').trim().toLowerCase();
        var branchText = (byId('filter-branch-search').value || '').trim().toLowerCase();
        // Package filter universe: all source packages involved in missing build-dep edges.
        var involvedPkgs = new Set();
        (graph.edges || []).forEach(function(e) {
          if (!e.missing) return;
          if (!includedRelease(e.release) && releaseSel.size > 0) return;
          if (!includedBranch(e.branch) && branchSel.size > 0) return;
          if (releaseText && !textIncludes(e.release, releaseText)) return;
          if (branchText && !textIncludes(e.branch, branchText)) return;
          if (e.from) involvedPkgs.add(e.from);
          if (e.to) involvedPkgs.add(e.to);
        });
        neededUniverse = Array.from(involvedPkgs).sort();
        // Drop stale selections.
        packageSel.forEach(function(v) { if (!involvedPkgs.has(v)) packageSel.delete(v); });
        renderOptions('filter-releases', graph.releases || [], releaseSel, byId('filter-release-search').value);
        renderOptions('filter-branches', graph.branches || [], branchSel, byId('filter-branch-search').value);
        renderOptions('filter-packages', neededUniverse, packageSel, byId('filter-package-search').value);
      }

      function includedRelease(v) { return releaseSel.size === 0 || releaseSel.has(v); }
      function includedBranch(v) { return branchSel.size === 0 || branchSel.has(v); }
      function textIncludes(hay, needle) { return String(hay || '').toLowerCase().indexOf(needle) >= 0; }

      /**
       * Build a chain-build string from the filtered missing-dependency edges.
       *
       * Each missing edge {from: A, to: B} means:
       *   "A has a BuildRequires from B, but B is not yet built/published."
       *
       * The chain contains ONLY the PROVIDERS (the `to` packages), i.e.
       * packages that need to be built to satisfy missing BuildRequires.
       */
      function buildChainFromFiltered(allEdges, missingEdges) {
        var providers = new Set();
        missingEdges.forEach(function(e) {
          if (e.to) providers.add(e.to);
        });

        if (!providers.size) return '';

        var providerList = Array.from(providers);
        var deps = {};
        var rdeps = {};
        providerList.forEach(function(p) { deps[p] = new Set(); rdeps[p] = new Set(); });

        allEdges.forEach(function(e) {
          if (!providers.has(e.from) || !providers.has(e.to)) return;
          if (e.from === e.to) return;
          deps[e.from].add(e.to);
          rdeps[e.to].add(e.from);
        });

        var inDeg = {};
        providerList.forEach(function(n) { inDeg[n] = deps[n].size; });

        function byPriority(a, b) {
          var sa = rdeps[a] ? rdeps[a].size : 0;
          var sb = rdeps[b] ? rdeps[b].size : 0;
          if (sb !== sa) return sb - sa;
          return a.localeCompare(b);
        }

        var done = new Set();
        var groups = [];
        while (done.size < providerList.length) {
          var ready = providerList
            .filter(function(n) { return !done.has(n) && inDeg[n] === 0; })
            .sort(byPriority);
          if (!ready.length) {
            ready = providerList.filter(function(n) { return !done.has(n); }).sort(byPriority);
          }
          groups.push(ready);
          ready.forEach(function(n) {
            done.add(n);
            if (rdeps[n]) rdeps[n].forEach(function(d) {
              inDeg[d] = Math.max(0, (inDeg[d] || 0) - 1);
            });
          });
        }

        return groups.map(function(g) { return g.join(' '); }).join(' : ');
      }

      function applyFilters() {
        if (!graph) return;
        var releaseText = (byId('filter-release-search').value || '').trim().toLowerCase();
        var branchText = (byId('filter-branch-search').value || '').trim().toLowerCase();
        var pkgText = (byId('filter-package-search').value || '').trim().toLowerCase();

        function edgePass(e) {
          var pkgMatch = packageSel.size === 0 || packageSel.has(e.from) || packageSel.has(e.to);
          return includedRelease(e.release) && includedBranch(e.branch)
            && pkgMatch
            && (!releaseText || textIncludes(e.release, releaseText))
            && (!branchText || textIncludes(e.branch, branchText))
            && (!pkgText || textIncludes(e.from, pkgText) || textIncludes(e.to, pkgText));
        }

        // Split edges into missing and ok.
        var filteredEdges = (graph.edges || []).filter(edgePass);
        var missingEdges = filteredEdges.filter(function(e) { return e.missing; });
        var okEdges = filteredEdges.filter(function(e) { return !e.missing; });
        var filteredRuntimeEdges = (graph.runtime_edges || []).filter(edgePass);
        var runtimeMissingEdges = filteredRuntimeEdges.filter(function(e) { return e.missing; });
        var runtimeOkEdges = filteredRuntimeEdges.filter(function(e) { return !e.missing; });

        // Deduplicate missing edges by (from, to) across arches.
        var seenMissingKey = new Set();
        var uniqueMissingEdges = [];
        missingEdges.forEach(function(e) {
          var k = e.release + '|' + e.branch + '|' + e.from + '|' + e.to;
          if (!seenMissingKey.has(k)) {
            seenMissingKey.add(k);
            uniqueMissingEdges.push(e);
          }
        });

        var mainChain = buildChainFromFiltered(filteredEdges, uniqueMissingEdges);
        byId('buildrequires-chain-output').value = mainChain || '';
        var runtimeChain = buildChainFromFiltered(filteredRuntimeEdges, runtimeMissingEdges);
        byId('requires-chain-output').value = runtimeChain || '';

        byId('deps-status').textContent =
          uniqueMissingEdges.length + ' missing build dependencies, '
          + runtimeMissingEdges.length + ' missing install-time dependencies, '
          + okEdges.length + ' satisfied build dependencies, '
          + runtimeOkEdges.length + ' satisfied install-time dependencies with current filters.';

        var summary = byId('deps-summary');
        if (summary) {
          var s = graph.summary || {};
          var errCount = Array.isArray(graph.repo_errors) ? graph.repo_errors.length : 0;
          summary.innerHTML =
            '<span class="deps-chip">repos scanned ' + esc(s.repositories_scanned || 0) + '</span>'
            + '<span class="deps-chip">source packages ' + esc(s.nodes || 0) + '</span>'
            + '<span class="deps-chip">missing build deps ' + esc(uniqueMissingEdges.length) + '</span>'
            + '<span class="deps-chip">missing install deps ' + esc(runtimeMissingEdges.length) + '</span>'
            + '<span class="deps-chip">satisfied deps ' + esc(okEdges.length) + '</span>'
            + (errCount ? ('<span class="deps-chip warn">repo errors ' + esc(errCount) + '</span>') : '');
        }

        // Missing build-dependency table (deduplicated, per release+branch).
        var missingPageSize = parseInt(byId('missing-page-size').value || '25', 10);
        var missingPages = Math.max(1, Math.ceil(uniqueMissingEdges.length / missingPageSize));
        if (missingPage > missingPages) missingPage = missingPages;
        if (missingPage < 1) missingPage = 1;
        var missingStart = (missingPage - 1) * missingPageSize;
        var missingRows = uniqueMissingEdges.slice(missingStart, missingStart + missingPageSize).map(function(e) {
          return '<tr>'
            + '<td>' + esc(e.release) + '</td>'
            + '<td>' + esc(e.branch) + '</td>'
            + '<td>' + esc(e.from) + '</td>'
            + '<td>' + esc(e.requirement) + '</td>'
            + '<td style="color:#c0392b;">' + esc(e.to) + '</td>'
            + '</tr>';
        }).join('');
        byId('missing-table').innerHTML =
          '<table class="table-list"><thead><tr>'
          + '<th>Release</th><th>Branch</th>'
          + '<th>Package (needs rebuild)</th>'
          + '<th>BuildRequires</th>'
          + '<th>Unbuilt provider</th>'
          + '</tr></thead>'
          + '<tbody>' + (missingRows || '<tr><td colspan="5">No missing build dependencies in this filter view.</td></tr>') + '</tbody></table>';
        byId('missing-page-info').textContent = 'Page ' + missingPage + ' of ' + missingPages + ' (' + uniqueMissingEdges.length + ' rows)';
        byId('missing-prev').disabled = missingPage <= 1;
        byId('missing-next').disabled = missingPage >= missingPages;

        // Missing install-time dependency table (deduplicated, per release+branch).
        var seenRuntimeMissingKey = new Set();
        var uniqueRuntimeMissingEdges = [];
        runtimeMissingEdges.forEach(function(e) {
          var k = e.release + '|' + e.branch + '|' + e.from + '|' + e.to;
          if (!seenRuntimeMissingKey.has(k)) {
            seenRuntimeMissingKey.add(k);
            uniqueRuntimeMissingEdges.push(e);
          }
        });
        var runtimeMissingPageSize = parseInt(byId('runtime-missing-page-size').value || '25', 10);
        var runtimeMissingPages = Math.max(1, Math.ceil(uniqueRuntimeMissingEdges.length / runtimeMissingPageSize));
        if (runtimeMissingPage > runtimeMissingPages) runtimeMissingPage = runtimeMissingPages;
        if (runtimeMissingPage < 1) runtimeMissingPage = 1;
        var runtimeMissingStart = (runtimeMissingPage - 1) * runtimeMissingPageSize;
        var runtimeMissingRows = uniqueRuntimeMissingEdges.slice(runtimeMissingStart, runtimeMissingStart + runtimeMissingPageSize).map(function(e) {
          return '<tr>'
            + '<td>' + esc(e.release) + '</td>'
            + '<td>' + esc(e.branch) + '</td>'
            + '<td>' + esc(e.from) + '</td>'
            + '<td>' + esc(e.requirement) + '</td>'
            + '<td style="color:#c0392b;">' + esc(e.to) + '</td>'
            + '</tr>';
        }).join('');
        byId('runtime-missing-table').innerHTML =
          '<table class="table-list"><thead><tr>'
          + '<th>Release</th><th>Branch</th>'
          + '<th>Package (requires)</th>'
          + '<th>Requires</th>'
          + '<th>Missing provider</th>'
          + '</tr></thead>'
          + '<tbody>' + (runtimeMissingRows || '<tr><td colspan="5">No missing install-time dependencies in this filter view.</td></tr>') + '</tbody></table>';
        byId('runtime-missing-page-info').textContent = 'Page ' + runtimeMissingPage + ' of ' + runtimeMissingPages + ' (' + uniqueRuntimeMissingEdges.length + ' rows)';
        byId('runtime-missing-prev').disabled = runtimeMissingPage <= 1;
        byId('runtime-missing-next').disabled = runtimeMissingPage >= runtimeMissingPages;

        // All edges table (both satisfied and missing).
        var edgesPageSize = parseInt(byId('edges-page-size').value || '50', 10);
        var edgesPages = Math.max(1, Math.ceil(filteredEdges.length / edgesPageSize));
        if (edgesPage > edgesPages) edgesPage = edgesPages;
        if (edgesPage < 1) edgesPage = 1;
        var edgesStart = (edgesPage - 1) * edgesPageSize;
        var edgeRows = filteredEdges.slice(edgesStart, edgesStart + edgesPageSize).map(function(e) {
          var to = e.missing ? ('<span style="color:#c0392b;">' + esc(e.to) + '</span>') : esc(e.to);
          return '<tr>'
            + '<td>' + esc(e.release) + '</td>'
            + '<td>' + esc(e.branch) + '</td>'
            + '<td>' + esc(e.arch) + '</td>'
            + '<td>' + esc(e.from) + '</td>'
            + '<td>' + esc(e.requirement) + '</td>'
            + '<td>' + to + '</td>'
            + '<td>' + (e.missing ? '<span style="color:#c0392b;">missing</span>' : 'ok') + '</td>'
            + '</tr>';
        }).join('');
        byId('edges-table').innerHTML =
          '<table class="table-list"><thead><tr>'
          + '<th>Release</th><th>Branch</th><th>Arch</th>'
          + '<th>Source (needs)</th><th>BuildRequires</th><th>Provider source</th><th>Status</th>'
          + '</tr></thead>'
          + '<tbody>' + (edgeRows || '<tr><td colspan="7">No dependency edges in this filter view.</td></tr>') + '</tbody></table>';
        byId('edges-page-info').textContent = 'Page ' + edgesPage + ' of ' + edgesPages + ' (' + filteredEdges.length + ' rows)';
        byId('edges-prev').disabled = edgesPage <= 1;
        byId('edges-next').disabled = edgesPage >= edgesPages;
      }

      function updateDepsAccess() {
        var authed = !!(api.token);
        var gate = byId('deps-login-gate');
        var panel = byId('deps-authed-content');
        if (gate) gate.style.display = authed ? 'none' : 'block';
        if (panel) panel.style.display = authed ? 'block' : 'none';
        if (authed && !depsGraphLoaded) loadGraph();
      }

      function loadGraph() {
        if (!api.token) {
          updateDepsAccess();
          return Promise.resolve();
        }
        byId('deps-status').textContent = 'Loading dependency graph...';
        return api.get('/dependencies/graph').then(function(data) {
          depsGraphLoaded = true;
          graph = data || {};
          packageUniverse = [];
          releaseSel = new Set(graph.releases || []);
          branchSel = new Set(graph.branches || []);
          packageSel = new Set();
          missingPage = 1;
          runtimeMissingPage = 1;
          edgesPage = 1;
          renderFilterBoxes();
          applyFilters();
        }).catch(function(e) {
          if ((e.message || '').toLowerCase().indexOf('authentication') >= 0) {
            api.setToken(null);
            depsGraphLoaded = false;
            updateDepsAccess();
            return;
          }
          byId('deps-status').textContent = 'Failed to load graph: ' + (e.message || e);
          byId('missing-table').innerHTML = '';
          byId('edges-table').innerHTML = '';
        });
      }

      byId('btn-deps-refresh').addEventListener('click', loadGraph);
      byId('btn-select-all').addEventListener('click', function() {
        if (!graph) return;
        releaseSel = new Set(graph.releases || []);
        branchSel = new Set(graph.branches || []);
        packageSel = new Set(packageUniverse);
        renderFilterBoxes();
        applyFilters();
      });
      byId('btn-select-none').addEventListener('click', function() {
        releaseSel = new Set();
        branchSel = new Set();
        packageSel = new Set();
        renderFilterBoxes();
        applyFilters();
      });
      byId('btn-copy-buildrequires-chain').addEventListener('click', function() {
        var txt = byId('buildrequires-chain-output').value || '';
        navigator.clipboard.writeText(txt).then(function() {
          byId('deps-status').textContent = 'BuildRequires chain string copied.';
        }).catch(function() {
          byId('deps-status').textContent = 'Copy failed, select and copy manually.';
        });
      });
      byId('btn-copy-requires-chain').addEventListener('click', function() {
        var txt = byId('requires-chain-output').value || '';
        navigator.clipboard.writeText(txt).then(function() {
          byId('deps-status').textContent = 'Requires chain string copied.';
        }).catch(function() {
          byId('deps-status').textContent = 'Copy failed, select and copy manually.';
        });
      });
      byId('filter-release-search').addEventListener('input', renderFilterBoxes);
      byId('filter-branch-search').addEventListener('input', renderFilterBoxes);
      byId('filter-package-search').addEventListener('input', renderFilterBoxes);
      byId('filter-release-search').addEventListener('input', function() { missingPage = 1; runtimeMissingPage = 1; edgesPage = 1; applyFilters(); });
      byId('filter-branch-search').addEventListener('input', function() { missingPage = 1; runtimeMissingPage = 1; edgesPage = 1; applyFilters(); });
      byId('filter-package-search').addEventListener('input', function() { missingPage = 1; runtimeMissingPage = 1; edgesPage = 1; applyFilters(); });
      byId('missing-prev').addEventListener('click', function() { missingPage -= 1; applyFilters(); });
      byId('missing-next').addEventListener('click', function() { missingPage += 1; applyFilters(); });
      byId('runtime-missing-prev').addEventListener('click', function() { runtimeMissingPage -= 1; applyFilters(); });
      byId('runtime-missing-next').addEventListener('click', function() { runtimeMissingPage += 1; applyFilters(); });
      byId('edges-prev').addEventListener('click', function() { edgesPage -= 1; applyFilters(); });
      byId('edges-next').addEventListener('click', function() { edgesPage += 1; applyFilters(); });
      byId('missing-page-size').addEventListener('change', function() { missingPage = 1; applyFilters(); });
      byId('runtime-missing-page-size').addEventListener('change', function() { runtimeMissingPage = 1; applyFilters(); });
      byId('edges-page-size').addEventListener('change', function() { edgesPage = 1; applyFilters(); });

      window.addEventListener('auth-change', function() {
        if (!api.token) depsGraphLoaded = false;
        updateDepsAccess();
      });
      updateDepsAccess();
    })();
  </script>
</body>
</html>
