<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Tag - Oreon Build Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/style.css?v=29">
  <style>
    .promo-testing { background: #d4edda; color: #155724; }
    .promo-stable { background: #cce5ff; color: #004085; }
    #release-search-select, #release-new-select { pointer-events: none; opacity: 0.7; }
    .side-tag-meta { margin: 0 0 0.85rem 0; }
    .tag-head { display: flex; flex-direction: column; align-items: flex-start; gap: 0.55rem; }
    .tag-title { display: flex; align-items: center; gap: 0.45rem; }
    .tag-head h2 { margin: 0; font-size: 1.25rem; }
    .tag-facts { display: flex; flex-wrap: wrap; gap: 0.65rem 1.35rem; }
    .tag-facts span { display: flex; flex-direction: column; gap: 0.05rem; white-space: nowrap; }
    .tag-facts .k { font-size: 0.72rem; color: var(--text-muted); }
    .tag-facts .v { font-size: 0.92rem; color: var(--text); }
    #side-tag-actions {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    #side-tag-actions .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    #side-tag-actions .action-label {
      font-size: 0.8rem;
      color: var(--text-muted, #777);
      min-width: 5rem;
    }
    #layer-build-alert { display: none; margin: 0.75rem 0 1rem; padding: 0.75rem 0.9rem; border-radius: 10px; border: none; box-shadow: none; outline: none; }
    #layer-build-alert.layer-alert-error { background: rgba(255,59,48,0.1); }
    #layer-build-alert.layer-alert-info { background: rgba(59,130,246,0.1); }
    #layer-build-alert.layer-alert-success { background: rgba(34,197,94,0.12); }
    #layer-build-alert h3 { margin: 0 0 0.35rem 0; font-size: 1rem; display: flex; align-items: center; gap: 0.4rem; }
    #layer-build-alert .layer-alert-actions { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav></nav>
  </header>
  <main class="main">
    <section class="card">
      <div id="side-tag-meta" class="side-tag-meta"></div>
      <div id="side-tag-actions"></div>
      <div id="trigger-build-section" style="display:none; margin: 0.25rem 0 1rem;">
        <div class="build-mode-tabs" style="margin-bottom:0.75rem;">
          <button type="button" class="build-mode-tab active" data-mode="existing">Existing package</button>
          <button type="button" class="build-mode-tab" data-mode="new">New package</button>
        </div>

        <div id="build-existing-block">
          <div class="form-group">
            <label>Package</label>
            <div id="package-search-select" class="search-select">
              <button type="button" class="search-select-trigger" id="package-trigger">Select package...</button>
              <div class="search-select-panel" id="package-panel">
                <input type="text" class="search-select-search" id="package-search" placeholder="Search packages...">
                <div class="search-select-list" id="package-list"></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Release</label>
            <div id="release-search-select" class="search-select">
              <button type="button" class="search-select-trigger" id="release-trigger">Select release...</button>
              <div class="search-select-panel" id="release-panel">
                <input type="text" class="search-select-search" id="release-search" placeholder="Search releases...">
                <div class="search-select-list" id="release-list"></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Architectures</label>
            <div class="arch-checkboxes" style="display:flex; gap:1rem;">
              <label><input type="checkbox" id="arch-x86_64-existing" checked> x86_64</label>
              <label><input type="checkbox" id="arch-aarch64-existing" checked> aarch64</label>
            </div>
          </div>
          <button type="button" class="btn primary" id="btn-trigger-build">Trigger build</button>
        </div>

        <div id="build-new-block" style="display:none;">
          <div class="form-group">
            <label>1. Select the source type</label>
            <div class="source-type-tabs" style="display:flex; gap:0.25rem; flex-wrap:wrap; margin-bottom:0.5rem;">
              <button type="button" class="source-type-tab active" data-type="url">From URLs</button>
              <button type="button" class="source-type-tab" data-type="upload">Upload</button>
              <button type="button" class="source-type-tab" data-type="scm">SCM</button>
              <button type="button" class="source-type-tab" data-type="distgit">DistGit</button>
              <button type="button" class="source-type-tab" data-type="chainbuild">Chain build</button>
            </div>
            <div id="source-url-panel" class="source-panel">
              <label>Source URL(s)</label>
              <input type="text" id="source-url-input" class="form-control" placeholder="https://... (one URL or comma-separated)">
            </div>
            <div id="source-upload-panel" class="source-panel" style="display:none;">
              <label>SRPM or spec</label>
              <input type="file" id="source-upload-files" class="form-control" accept=".src.rpm,.spec" multiple>
            </div>
            <div id="source-scm-panel" class="source-panel" style="display:none;">
              <label>Repository URL</label>
              <input type="text" id="source-scm-url" class="form-control" placeholder="https://github.com/org/repo.git#branch:path">
              <label style="margin-top:0.5rem;">Branch (optional)</label>
              <input type="text" id="source-scm-branch" class="form-control" placeholder="main">
            </div>
            <div id="source-distgit-panel" class="source-panel" style="display:none;">
              <label>Package names</label>
                <textarea id="distgit-packages" class="form-control" rows="3" placeholder="one package per line"></textarea>
            </div>
            <div id="source-chainbuild-panel" class="source-panel" style="display:none;">
              <label>Chain</label>
              <textarea id="chainbuild-spec" class="form-control" rows="3" placeholder="pkg-a pkg-b : pkg-c"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label>Release</label>
            <div id="release-new-select" class="search-select">
              <button type="button" class="search-select-trigger" id="release-new-trigger">Select release...</button>
              <div class="search-select-panel" id="release-new-panel">
                <input type="text" class="search-select-search" id="release-new-search" placeholder="Search releases...">
                <div class="search-select-list" id="release-new-list"></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Specfiles Git branch</label>
            <input type="text" id="distgit-branch-input" class="form-control" placeholder="branch" maxlength="128">
          </div>
          <div class="form-group">
            <label>Mock environment (optional)</label>
            <select id="new-package-mock-env" class="form-control">
              <option value="">Use release default</option>
            </select>
          </div>
          <div class="form-group">
            <label>Architectures</label>
            <div class="arch-checkboxes" style="display:flex; gap:1rem;">
              <label><input type="checkbox" id="arch-x86_64-new" checked> x86_64</label>
              <label><input type="checkbox" id="arch-aarch64-new" checked> aarch64</label>
            </div>
          </div>
          <button type="button" class="btn primary" id="btn-create-and-build">Create package and trigger build</button>
        </div>
      </div>
      <div id="layer-build-alert" role="alert"></div>
      <div class="form-group" style="margin-bottom:1rem;">
        <input type="text" id="builds-filter" name="oreon-build-filter" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" placeholder="Filter" style="padding:0.4rem 0.55rem; width:100%; max-width:16rem;">
      </div>
      <div class="list-toolbar">
        <div class="bulk-selection-bar" id="builds-bulk-bar">
          <span class="bulk-selection-count"></span>
          <span class="bulk-selection-buttons"></span>
        </div>
        <div class="select-all-wrap">
          <label for="builds-select-all">Select all</label>
        </div>
        <div class="pagination" id="builds-pagination">
          <button type="button" class="btn" id="builds-prev" disabled>Prev</button>
          <span class="page-info" id="builds-page-info">Page 1 of 1</span>
          <button type="button" class="btn" id="builds-next" disabled>Next</button>
          <select class="page-size" id="builds-page-size" title="Items per page">
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>
      <table class="table-list">
        <thead>
          <tr><th class="col-checkbox"><input type="checkbox" id="builds-select-all" title="Select all on this page"></th><th>ID</th><th>Package</th><th>Arch</th><th>Status</th><th>Signing</th><th>Chain</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="builds-tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js?v=31"></script>
  <script>
    (function() {
      const api = window.oreonApi;
      var packages = [], releases = [];
      var selectedPackageId = null, selectedReleaseId = null, selectedReleaseIdNew = null;
      var currentSourceType = 'url';
      var sideTagId = parseInt(new URLSearchParams(window.location.search).get('id') || '', 10);
      var sideTag = null;
      var canAccessTag = false;

      function updateLoggedInUI() {
        const section = document.getElementById('trigger-build-section');
        if (!sideTagId) {
          if (section) section.style.display = 'none';
          renderSideTagChrome();
          return;
        }
        if (api.token && canAccessTag) loadOptions();
        else if (section) section.style.display = 'none';
        renderSideTagChrome();
      }
      function loadOptions() {
        api.get('/packages?limit=500').then(function(r) { packages = (r && r.items) ? r.items : []; renderPackageList(); }).catch(function() { packages = []; });
        api.get('/releases?limit=500&active_only=true').then(function(r) {
          releases = (r && r.items) ? r.items : [];
          if (sideTag && sideTag.release_id) {
            selectedReleaseId = Number(sideTag.release_id);
            selectedReleaseIdNew = Number(sideTag.release_id);
            fillMockEnvsForRelease(selectedReleaseIdNew);
          }
          renderReleaseList();
          renderReleaseListNew();
          updateDistgitBranchFromRelease();
        }).catch(function() { releases = []; updateDistgitBranchFromRelease(); });
      }
      function renderSideTagChrome() {
        var meta = document.getElementById('side-tag-meta');
        var actions = document.getElementById('side-tag-actions');
        if (!sideTag) {
          if (meta) meta.textContent = sideTagId ? ('Loading #' + sideTagId) : 'Missing side tag id';
          if (actions) { actions.style.display = 'none'; actions.innerHTML = ''; }
          return;
        }
        var st = sideTag.status || 'idle';
        var icon = window.oreonStatusIcon ? window.oreonStatusIcon(st) : escapeHtml(st);
        var members = (sideTag.members || []).map(function(m) { return m.username; }).filter(Boolean);
        var memberText = members.length ? members.join(', ') : 'None';
        var activity = (sideTag.last_activity_at || '').toString().replace('T', ' ').slice(0, 16);
        function fact(k, v) {
          return '<span><span class="k">' + k + '</span><span class="v">' + escapeHtml(v) + '</span></span>';
        }
        if (meta) {
          meta.innerHTML =
            '<div class="tag-head">' +
            '<div class="tag-title">' + icon + '<h2>' + escapeHtml(sideTag.name) + '</h2></div>' +
            '<div class="tag-facts">' +
              fact('Release', sideTag.releasename || ('#' + sideTag.release_id)) +
              fact('Owner', sideTag.owner_username || '-') +
              fact('Members', memberText) +
              fact('From', sideTag.created_from || '-') +
              (activity ? fact('Last activity', activity) : '') +
            '</div></div>';
        }
        document.title = sideTag.name + ' - Side Tag';
        if (!actions) return;
        if (!api.token) { actions.style.display = 'none'; actions.innerHTML = ''; return; }
        actions.style.display = 'flex';
        var html = '<div class="action-row">';
        if (canAccessTag) {
          html += '<button type="button" class="btn" id="btn-show-build">New build</button>';
          html += '<input type="text" id="invite-username" class="form-control" placeholder="username" style="width:9rem;max-width:9rem;">';
          html += '<button type="button" class="btn" id="btn-invite">Invite</button>';
        }
        html += '<button type="button" class="btn promo-testing" id="btn-promo-dev">dev</button>';
        html += '<button type="button" class="btn promo-testing" id="btn-promo-testing">testing</button>';
        html += '<button type="button" class="btn promo-stable" id="btn-promo-stable">stable</button>';
        if (canAccessTag) html += '<button type="button" class="btn" id="btn-scrap">Scrap</button>';
        html += '</div>';
        html += '<div id="side-tag-promo-status" style="color:var(--text-muted);font-size:0.9rem;"></div>';
        actions.innerHTML = html;
        var showBuild = document.getElementById('btn-show-build');
        if (showBuild) showBuild.onclick = function() {
          var section = document.getElementById('trigger-build-section');
          if (!section) return;
          section.style.display = section.style.display === 'block' ? 'none' : 'block';
        };
        var inv = document.getElementById('btn-invite');
        if (inv) inv.onclick = function() {
          var u = (document.getElementById('invite-username').value || '').trim();
          if (!u) { alert('Enter username'); return; }
          oreonWithLoading(inv, function() {
            return api.post('/side-tags/' + sideTagId + '/invite', { username: u })
              .then(function(t) { sideTag = t; canAccessTag = !!t.can_access; updateLoggedInUI(); })
              .catch(function(e) { alert(e.message); });
          });
        };
        var scrap = document.getElementById('btn-scrap');
        if (scrap) scrap.onclick = function() {
          if (!confirm('Scrap side tag ' + sideTag.name + '? Deletes R2 tree, cancels open jobs, removes DB row.')) return;
          if (!confirm('Really scrap ' + sideTag.name + '?')) return;
          oreonWithLoading(scrap, function() {
            return api.post('/side-tags/' + sideTagId + '/scrap', {})
              .then(function() { window.location.href = '/side-tags.html'; })
              .catch(function(e) { alert(e.message); });
          });
        };
        function setPromoStatus(msg) {
          var el = document.getElementById('side-tag-promo-status');
          if (el) el.textContent = msg || '';
        }
        function pollPromoteJob(jobId, to) {
          var tries = 0;
          function tick() {
            tries += 1;
            api.get('/promotions/jobs/' + encodeURIComponent(jobId)).then(function(job) {
              var st = (job && job.status) || '?';
              setPromoStatus('Promote - ' + to + ': ' + st + (job.error ? (' - ' + job.error) : ''));
              if (st === 'ok') {
                window.location.href = '/side-tags.html';
                return;
              }
              if (st === 'failed') return;
              if (tries < 1200) setTimeout(tick, 3000);
            }).catch(function(e) {
              setPromoStatus('Poll failed: ' + (e.message || e));
            });
          }
          tick();
        }
        function doPromote(to) {
          if (!confirm('Promote entire side tag to ' + to + '? Tag will be DELETED after copy finishes in the background.')) return Promise.reject(new Error('cancelled'));
          if (!confirm('Confirm queue promote ' + sideTag.name + ' - ' + to + '.')) return Promise.reject(new Error('cancelled'));
          return api.post('/side-tags/' + sideTagId + '/promote', { to_branch: to })
            .then(function(data) {
              setPromoStatus('Queued promote - ' + to + ' (job ' + (data.job_id || '?') + '). You can leave this page.');
              if (data.job_id) pollPromoteJob(data.job_id, to);
              return data;
            });
        }
        function wirePromo(btn, to) {
          if (!btn) return;
          btn.onclick = function() {
            oreonWithLoading(btn, function() {
              return doPromote(to).catch(function(e) {
                if (e && e.message === 'cancelled') return;
                alert(e.message || e);
              });
            });
          };
        }
        wirePromo(document.getElementById('btn-promo-dev'), 'dev');
        wirePromo(document.getElementById('btn-promo-testing'), 'testing');
        wirePromo(document.getElementById('btn-promo-stable'), 'stable');
      }
      function loadSideTag() {
        if (!sideTagId) { updateLoggedInUI(); return Promise.resolve(); }
        return api.get('/side-tags/' + sideTagId).then(function(t) {
          sideTag = t;
          canAccessTag = !!t.can_access;
          selectedReleaseId = Number(t.release_id);
          selectedReleaseIdNew = Number(t.release_id);
          updateLoggedInUI();
        }).catch(function(e) {
          var meta = document.getElementById('side-tag-meta');
          if (meta) meta.textContent = 'Failed to load side tag: ' + (e.message || e);
        });
      }
      // (helper makeSearchableSelect was removed; selects are wired manually below)
      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s).replace(/\u2026/g, '');
        return d.innerHTML;
      }
      function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
      var layerPollTimer = null;
      var watchedChainId = null;
      function stopLayerPoll() {
        if (layerPollTimer) { clearInterval(layerPollTimer); layerPollTimer = null; }
      }
      function bindLayerAlertActions(el, opts) {
        var dismiss = document.getElementById('layer-alert-dismiss');
        if (dismiss) dismiss.onclick = function() { el.style.display = 'none'; stopLayerPoll(); };
        var resumeBtn = document.getElementById('layer-alert-resume');
        if (resumeBtn) {
          resumeBtn.onclick = function() {
            if (!opts.chainId) return;
            resumeBtn.disabled = true;
            api.post('/builds/chain/' + opts.chainId + '/resume').then(function(data) {
              renderChainAlertFromStatus(data);
              pollChainStatus(opts.chainId);
              render();
            }).catch(function(e) { resumeBtn.disabled = false; alert(e.message || e); });
          };
        }
        var cancelBtn = document.getElementById('layer-alert-cancel');
        if (cancelBtn) {
          cancelBtn.onclick = function() {
            if (!opts.chainId) return;
            if (!confirm('Cancel chain ' + opts.chainId + '? Stops all open jobs in this chain.')) return;
            cancelBtn.disabled = true;
            api.post('/builds/chain/' + opts.chainId + '/cancel').then(function(data) {
              renderChainAlertFromStatus(data);
              render();
            }).catch(function(e) { cancelBtn.disabled = false; alert(e.message || e); });
          };
        }
      }
      function showLayerAlert(kind, title, bodyHtml, opts) {
        opts = opts || {};
        var el = document.getElementById('layer-build-alert');
        if (!el) return;
        el.style.display = 'block';
        el.className = 'layer-alert-' + (kind || 'info');
        var shellKey = [kind || 'info', opts.showResume ? '1' : '0', opts.showCancel ? '1' : '0', String(opts.chainId || '')].join('|');
        var titleEl = el.querySelector('h3');
        var bodyEl = el.querySelector('.layer-alert-body');
        if (el.getAttribute('data-alert-shell') === shellKey && titleEl && bodyEl) {
          titleEl.innerHTML = (opts.iconHtml || '') + escapeHtml(title);
          bodyEl.innerHTML = bodyHtml;
          return;
        }
        el.setAttribute('data-alert-shell', shellKey);
        var actions = '<div class="layer-alert-actions">';
        if (opts.showResume) {
          actions += '<button type="button" class="btn" id="layer-alert-resume">Resume chain</button>';
        }
        if (opts.showCancel) {
          actions += '<button type="button" class="btn" id="layer-alert-cancel">Cancel chain</button>';
        }
        actions += '<button type="button" class="btn" id="layer-alert-dismiss">Dismiss</button></div>';
        el.innerHTML = '<h3>' + (opts.iconHtml || '') + escapeHtml(title) + '</h3><div class="layer-alert-body">' + bodyHtml + '</div>' + actions;
        bindLayerAlertActions(el, opts);
      }
      function renderLayerFailedJobs(data) {
        var jobs = (data.jobs || []).filter(function(j) {
          return (j.status || '').toLowerCase() === 'failed';
        });
        if (!jobs.length) return '';
        var items = jobs.map(function(j) {
          var label = j.package_name || ('job-' + j.job_id);
          if (j.architecture) label += ' (' + j.architecture + ')';
          return '<li style="margin:0.2rem 0;"><a href="/build.html?job_id=' + encodeURIComponent(j.job_id) + '">'
            + escapeHtml(label) + '</a></li>';
        });
        return '<p style="margin:0.5rem 0 0.25rem 0;">Failed packages</p>'
          + '<ul style="margin:0 0 0.75rem 1.1rem;padding:0;list-style:disc;">' + items.join('') + '</ul>';
      }
      function chainCountsHtml(counts) {
        var keys = ['running', 'queued', 'pending', 'blocked', 'success', 'failed', 'cancelled'];
        var bits = [];
        keys.forEach(function(k) {
          if (!counts || !counts[k]) return;
          var icon = window.oreonStatusIcon ? window.oreonStatusIcon(k) : escapeHtml(k);
          bits.push('<span class="chain-count">' + icon + '<span>' + counts[k] + '</span></span>');
        });
        return '<div class="chain-counts">' + bits.join('') + '</div>';
      }
      function chainThreatsHtml(data) {
        var rows = data.threats || [];
        if (!rows.length) return '';
        var items = rows.map(function(t) {
          var label = (t.package_name || ('job ' + t.job_id)) + ' ' + (t.rule || '');
          return '<li><a href="/security-finding.html?id=' + encodeURIComponent(t.finding_id) + '">' + escapeHtml(label) + '</a></li>';
        });
        return '<ul style="margin:0.4rem 0 0 1.1rem;padding:0;">' + items.join('') + '</ul>';
      }
      function renderChainAlertFromStatus(data) {
        if (!data) return;
        watchedChainId = data.chain_plan_id;
        var st = (data.status || '').toLowerCase();
        var progress = 'Group ' + data.current_group + ' of ' + data.total_groups;
        var live = st === 'running' || st === 'waiting_settle' || st === 'pending';
        var head = 'Chain ' + data.chain_plan_id;
        if (st === 'failed' || st === 'cancelled') {
          showLayerAlert('error', head,
            (data.error_message ? '<p style="margin:0 0 0.4rem 0;">' + escapeHtml(data.error_message) + '</p>' : '')
            + renderLayerFailedJobs(data)
            + chainCountsHtml(data.counts)
            + chainThreatsHtml(data)
            + '<p style="margin:0.35rem 0 0;color:var(--text-muted);font-size:0.85rem;">' + escapeHtml(progress) + '</p>',
            { showResume: true, chainId: data.chain_plan_id });
          stopLayerPoll();
          return;
        }
        if (st === 'success') {
          showLayerAlert('success', head, chainCountsHtml(data.counts) + chainThreatsHtml(data), { chainId: data.chain_plan_id });
          stopLayerPoll();
          return;
        }
        showLayerAlert('info', head,
          '<p style="margin:0 0 0.35rem 0;">' + escapeHtml(progress) + '</p>' + chainCountsHtml(data.counts) + chainThreatsHtml(data),
          { showCancel: live, chainId: data.chain_plan_id });
      }
      function pollChainStatus(chainId) {
        watchedChainId = chainId;
        stopLayerPoll();
        function tick() {
          api.get('/builds/chain/' + chainId + '/status?t=' + Date.now()).then(function(data) {
            if (watchedChainId !== chainId) return;
            renderChainAlertFromStatus(data);
            if (data.status === 'failed' || data.status === 'cancelled' || data.status === 'success') render();
          }).catch(function() {});
        }
        tick();
        layerPollTimer = setInterval(tick, 2500);
      }
      function followNewChain(data) {

          var u = (document.getElementById('source-scm-url') && document.getElementById('source-scm-url').value || '').trim();
          if (u) newPackage.source_url = u;
          var b = (document.getElementById('source-scm-branch') && document.getElementById('source-scm-branch').value || '').trim();
          if (b) newPackage.source_branch = b;
          oreonWithLoading(_btn, function() {
            return api.post('/builds/trigger', { new_package: newPackage, release_id: selectedReleaseIdNew, side_tag_id: sideTagId, architectures: arches })
              .then(function(data) {
                render();
                if (data && data.status === 'accepted') {
                  alert(buildAcceptedMessage(data, 'Build trigger accepted.'));
                  return;
                }
                var jobs = Array.isArray(data) ? data : (data ? [data] : []);
                if (jobs.length) alert('Build triggered for ' + jobs.length + ' architecture(s).');
                else alert('No new jobs queued. All selected arches already built for this package and release.');
              })
              .catch(function(e) { alert('Failed: ' + (e.message || 'Unknown error')); });
          });
        } else if (currentSourceType === 'distgit') {
          var pkgsRaw = (document.getElementById('distgit-packages') && document.getElementById('distgit-packages').value) || '';
          var pkgNames = pkgsRaw
            .split(/[\s,]+/)
            .map(function(s) { return s.trim(); })
            .filter(function(s) { return !!s; });
          if (!pkgNames.length) { alert('Enter at least one package name.'); return; }
          var rel = releaseById(selectedReleaseIdNew);
          var releasename = rel && rel.releasename ? rel.releasename.trim()  : '-';
          if (!releasename) { alert('Selected release is missing a releasename.'); return; }
        var batchBody = {
          release_id: selectedReleaseIdNew,
          side_tag_id: sideTagId,
          architectures: arches,
          skip_complete_arches: false,
          packages: pkgNames.map(function(pkgName) {
            return { name: pkgName, spec_path: releasename + '/' + pkgName + '/' + pkgName + '.spec' };
          })
        };
        if (mockIdVal) batchBody.preferred_mock_environment_id = parseInt(mockIdVal, 10);
        batchBody.distgit_branch = getDistgitBranch();
        oreonWithLoading(_btn, function() {
          return api.post('/builds/trigger-batch', batchBody)
            .then(function(data) {
              render();
              var n = (data && data.package_count) ? data.package_count : pkgNames.length;
              alert(buildAcceptedMessage(data, 'Queued ' + n + ' DistGit package(s) in the background.'));
            })
            .catch(function(e) { alert('Failed: ' + (e.message || 'Unknown error')); });
        });
          return;
        } else if (currentSourceType === 'chainbuild') {
          var chainSpec = (document.getElementById('chainbuild-spec') && document.getElementById('chainbuild-spec').value || '').trim();
          if (!chainSpec) { alert('Enter a package chain.'); return; }
          var chainBody = {
            chain: chainSpec,
            release_id: selectedReleaseIdNew,
            side_tag_id: sideTagId,
            architectures: arches,
            distgit_branch: getDistgitBranch()
          };
          if (mockIdVal) chainBody.preferred_mock_environment_id = parseInt(mockIdVal, 10);
          oreonWithLoading(_btn, function() {
            return api.post('/builds/chain-trigger', chainBody)
              .then(function(data) {
                render();
                followNewChain(data);
              })
              .catch(function(e) { alert('Failed: ' + (e.message || 'Unknown error')); });
          });
          return;
        }
      });
      render();
      startWatchLayerFromUrl();
    })();
  </script>
</body>
</html>
