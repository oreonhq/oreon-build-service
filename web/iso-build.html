<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO Build - Oreon Build Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/style.css?v=4">
  <style>
    .log-viewer { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 4px; overflow: auto; max-height: 70vh; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    .build-meta dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; }
    .build-meta dt { color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav></nav>
  </header>
  <main class="main">
    <section class="card">
      <p><a href="/iso-builds.html">ISO Builds</a></p>
      <h2>ISO <span id="iso-id"></span></h2>
      <div id="iso-meta" class="build-meta"></div>
      <h3>Log</h3>
      <pre id="iso-log" class="log-viewer">(no log yet)</pre>
    </section>
  </main>
  <script src="/static/app.js?v=21"></script>
  <script>
    (function() {
      var api = window.oreonApi;
      var id = new URLSearchParams(window.location.search).get('id') || '';
      document.getElementById('iso-id').textContent = id || '---';
      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }
      function statusClass(s) {
        if (s === 'success') return 'badge success';
        if (s === 'failed' || s === 'cancelled') return 'badge failed';
        if (s === 'running' || s === 'queued') return 'badge running';
        return 'badge pending';
      }
      function load() {
        if (!id) return;
        api.get('/iso-builds/' + id).then(function(job) {
          var dl = job.status === 'success'
            ? '<p><a class="btn" href="/api/iso-builds/' + job.id + '/download">Download ISO</a></p>'
            : '';
          document.getElementById('iso-meta').innerHTML =
            '<dl>' +
            '<dt>Name</dt><dd>' + escapeHtml(job.iso_name) + '</dd>' +
            '<dt>Status</dt><dd><span class="' + statusClass(job.status) + '">' + escapeHtml(job.status) + '</span></dd>' +
            '<dt>Arch</dt><dd>' + escapeHtml(job.architecture) + '</dd>' +
            '<dt>Kickstart</dt><dd>' + escapeHtml(job.release_folder) + '/' + escapeHtml(job.kickstart) + '</dd>' +
            '<dt>Mock</dt><dd>' + escapeHtml(job.mock_config || '') + '</dd>' +
            '<dt>SHA256</dt><dd style="font-family:ui-monospace,monospace">' + escapeHtml(job.sha256 || '') + '</dd>' +
            (job.error_message ? '<dt>Error</dt><dd>' + escapeHtml(job.error_message) + '</dd>' : '') +
            '</dl>' + dl;
          if (job.status !== 'running' && job.status !== 'queued') {
            if (window.__isoLogPoll) { clearInterval(window.__isoLogPoll); window.__isoLogPoll = null; }
          }
        });
        api.get('/iso-builds/' + id + '/log').then(function(data) {
          document.getElementById('iso-log').textContent = (data && data.log) ? data.log : '(no log yet)';
        });
      }
      load();
      window.__isoLogPoll = setInterval(load, 15000);
    })();
  </script>
</body>
</html>
