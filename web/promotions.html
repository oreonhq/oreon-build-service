<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions - Oreon Build Service</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <style>
    .promo-testing { background: #d4edda; color: #155724; }
    .promo-stable { background: #cce5ff; color: #004085; }
    .promo-keep { background: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/builds.html">Builds</a>
      <a href="/failures.html">Failures</a>
      <a href="/packages.html">Packages</a>
      <a href="/releases.html">Releases</a>
      <a href="/workers.html">Workers</a>
      <a href="/mock-environments.html">Mock Environments</a>
      <a href="/repos.html">Repositories</a>
      <a href="/promotions.html">Promotions</a>
      <a href="/dependencies.html">Dependencies</a>
      <form class="navbar-search" action="/search.html" method="get" style="display:inline-flex; margin-left:0.5rem;">
        <input type="search" name="q" placeholder="Search…" style="padding:0.25rem 0.5rem; width:10rem;">
        <button type="submit" class="btn" style="margin-left:0.25rem;">Go</button>
      </form>
      <span id="auth-section"><span id="user-info"></span><button id="btn-login" type="button">Login</button><button id="btn-logout" type="button" style="display:none">Logout</button></span>
    </nav>
  </header>
  <main class="main">
    <section class="card">
      <h2>Promotions</h2>
      <p id="promo-hint">Completed builds appear here as promotion candidates. Login to promote to Testing or Stable.</p>
      <div id="promo-quick-actions" style="display:none; margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button type="button" class="btn promo-testing" id="btn-promote-all-testing">Promote all to Testing</button>
        <button type="button" class="btn promo-stable" id="btn-promote-all-stable">Promote all to Stable</button>
      </div>
      <div class="form-group" style="margin-bottom:1rem; display:flex; gap:1rem; flex-wrap:wrap;">
        <label style="display:flex; align-items:center;">Filter</label>
        <input type="text" id="promo-text-filter" placeholder="Filter by package, ID…" style="padding:0.4rem; width:12rem;">
        <select id="promo-status-filter">
          <option value="">All</option>
          <option value="pending" selected>Pending only</option>
          <option value="promoted_testing">Promoted to Testing</option>
          <option value="promoted_stable">Promoted to Stable</option>
        </select>
      </div>
      <div class="list-toolbar">
        <div class="bulk-selection-bar" id="promo-bulk-bar">
          <span class="bulk-selection-count"></span>
          <span class="bulk-selection-buttons"></span>
        </div>
        <div class="select-all-wrap"><label for="promo-select-all">Select all</label></div>
        <div class="pagination">
          <button type="button" class="btn" id="promo-prev" disabled>Prev</button>
          <span class="page-info" id="promo-page-info">Page 1 of 1</span>
          <button type="button" class="btn" id="promo-next" disabled>Next</button>
          <select class="page-size" id="promo-page-size"><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select>
        </div>
      </div>
      <table class="table-list">
        <thead>
          <tr><th class="col-checkbox"><input type="checkbox" id="promo-select-all" title="Select all on this page"></th><th>ID</th><th>Package</th><th>Release ID</th><th>Build Job</th><th>Status</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody id="promo-tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js?v=6"></script>
  <script>
    (function() {
      const api = window.oreonApi;
      var promoPage = 0, promoPageSize = 25, promoTotal = 0;

      function promoteAll(pathSuffix, label) {
        if (!confirm('Promote ALL pending promotions to ' + label + '?\n\nThis will affect every pending item, not just this page.')) return;
        if (!confirm('Are you absolutely sure? This will promote everything pending to ' + label + ' and cannot be undone.')) return;
        var btn = document.getElementById(pathSuffix === 'to-testing' ? 'btn-promote-all-testing' : 'btn-promote-all-stable');
        oreonWithLoading(btn, function() {
          return api.get('/promotions?status_filter=pending&limit=10000').then(function(data) {
            var items = (data && data.items) ? data.items : [];
            var chain = Promise.resolve();
            items.forEach(function(p) {
              if (p.status === 'pending') {
                chain = chain.then(function() { return api.post('/promotions/' + p.id + '/' + pathSuffix); });
              }
            });
            return chain;
          }).then(function() { load(); }).catch(function(e) { alert('Failed: ' + e.message); });
        });
      }

      function updateQuickActions() {
        var el = document.getElementById('promo-quick-actions');
        if (!el) return;
        el.style.display = api.token ? 'flex' : 'none';
      }
      var promoTableSel = window.oreonBindTableSelection(document.getElementById('promo-tbody'), {
        rowCheckboxSelector: '.promo-row-cb',
        selectAll: document.getElementById('promo-select-all'),
        bulkBar: document.getElementById('promo-bulk-bar'),
        onSelectionChange: function(ids, btns) {
          var tbody = document.getElementById('promo-tbody');
          var clear = document.createElement('button');
          clear.type = 'button';
          clear.className = 'btn';
          clear.textContent = 'Clear selection';
          clear.addEventListener('click', function() {
            tbody.querySelectorAll('.promo-row-cb').forEach(function(cb) { cb.checked = false; });
            promoTableSel.refresh();
          });
          btns.appendChild(clear);
          if (!api.token) return;
          function runPromote(btn, pathSuffix) {
            var chain = Promise.resolve();
            ids.forEach(function(id) {
              var tr = tbody.querySelector('tr[data-id="' + id + '"]');
              var st = tr ? (tr.getAttribute('data-status') || '') : '';
              if (st !== 'pending') return;
              chain = chain.then(function() { return api.post('/promotions/' + id + '/' + pathSuffix); });
            });
            oreonWithLoading(btn, function() {
              return chain.then(function() { load(); }).catch(function(e) { alert('Failed: ' + e.message); });
            });
          }
          var b1 = document.createElement('button');
          b1.type = 'button';
          b1.className = 'btn promo-testing';
          b1.textContent = 'Promote selected to Testing';
          b1.addEventListener('click', function() { runPromote(b1, 'to-testing'); });
          btns.appendChild(b1);
          var b2 = document.createElement('button');
          b2.type = 'button';
          b2.className = 'btn promo-stable';
          b2.textContent = 'Promote selected to Stable';
          b2.addEventListener('click', function() { runPromote(b2, 'to-stable'); });
          btns.appendChild(b2);
        }
      });
      function load() {
        var statusFilter = document.getElementById('promo-status-filter').value;
        var path = '/promotions?limit=' + promoPageSize + '&offset=' + (promoPage * promoPageSize);
        if (statusFilter) path += '&status_filter=' + encodeURIComponent(statusFilter);
        var tf = document.getElementById('promo-text-filter');
        var pq = (tf && tf.value) ? String(tf.value).trim() : '';
        if (pq) path += '&search=' + encodeURIComponent(pq);
        api.get(path).then(function(data) {
          var tbody = document.getElementById('promo-tbody');
          if (!tbody) return;
          var list = (data && data.items) ? data.items : [];
          promoTotal = (data && typeof data.total === 'number') ? data.total : 0;
          var canAct = !!api.token;
          function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
          tbody.innerHTML = list.map(function(p) {
            var status = p.status || 'pending';
            var statusClass = status === 'promoted_testing' ? 'promo-testing' : status === 'promoted_stable' ? 'promo-stable' : status === 'kept_dev' ? 'promo-keep' : '';
            var actions = '';
            if (status === 'pending' && canAct) {
              actions = '<button type="button" class="btn promo-testing" data-id="' + p.id + '" data-action="to-testing">Promote to Testing</button> ' +
                '<button type="button" class="btn promo-stable" data-id="' + p.id + '" data-action="to-stable">Promote to Stable</button>';
            } else {
              actions = p.to_channel ? (p.from_channel + ' → ' + p.to_channel) : '-';
            }
            return '<tr data-id="' + p.id + '" data-status="' + esc(status) + '"><td class="col-checkbox"><input type="checkbox" class="promo-row-cb" data-id="' + p.id + '"></td><td>' + p.id + '</td><td>' + esc(p.package_name || '') + ' <span style="color:var(--text-muted)">(' + (p.package_id || '') + ')</span></td><td>' + p.release_id + '</td><td>' +
              (p.build_job_id ? '<a href="/build.html?job_id=' + p.build_job_id + '">' + p.build_job_id + '</a>' : '-') + '</td><td><span class="' + statusClass + '">' + esc(status) + '</span></td><td>' + (p.created_at ? new Date(p.created_at).toLocaleString() : '') + '</td><td>' + actions + '</td></tr>';
          }).join('') || '<tr><td colspan="8">No promotions</td></tr>';
          tbody.querySelectorAll('[data-action]').forEach(function(btn) {
            btn.addEventListener('click', function() {
              var id = btn.dataset.id;
              var action = btn.dataset.action;
              var postPath = '/promotions/' + id + '/' + (action === 'to-testing' ? 'to-testing' : 'to-stable');
              oreonWithLoading(btn, function() {
                return api.post(postPath).then(function() { load(); }).catch(function(e) { alert('Failed: ' + e.message); });
              });
            });
          });
          var numPages = promoTotal ? Math.ceil(promoTotal / promoPageSize) : 1;
          document.getElementById('promo-page-info').textContent = 'Page ' + (promoPage + 1) + ' of ' + numPages;
          document.getElementById('promo-prev').disabled = promoPage <= 0;
          document.getElementById('promo-next').disabled = promoPage >= numPages - 1;
          promoTableSel.refresh();
        }).catch(function() {
          var tbody = document.getElementById('promo-tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="8">Failed to load</td></tr>';
        });
      }
      (function initPromoPagination() {
        document.getElementById('promo-prev').addEventListener('click', function() { if (promoPage > 0) { promoPage--; load(); } });
        document.getElementById('promo-next').addEventListener('click', function() { var n = promoTotal ? Math.ceil(promoTotal / promoPageSize) : 1; if (promoPage < n - 1) { promoPage++; load(); } });
        document.getElementById('promo-page-size').addEventListener('change', function() { promoPageSize = parseInt(this.value, 10) || 25; promoPage = 0; load(); });
      })();
      document.getElementById('promo-status-filter').addEventListener('change', function() { promoPage = 0; load(); });
      var ptf = document.getElementById('promo-text-filter');
      if (ptf && window.oreonDebounce) {
        ptf.addEventListener('input', window.oreonDebounce(function() {
          promoPage = 0;
          load();
        }, 300));
      }
      document.getElementById('btn-promote-all-testing').addEventListener('click', function() { promoteAll('to-testing', 'Testing'); });
      document.getElementById('btn-promote-all-stable').addEventListener('click', function() { promoteAll('to-stable', 'Stable'); });
      window.addEventListener('auth-change', updateQuickActions);
      updateQuickActions();
      load();
    })();
  </script>
</body>
</html>
