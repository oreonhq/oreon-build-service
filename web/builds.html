<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builds - Oreon Build Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav></nav>
  </header>
  <main class="main">
    <section class="card">
      <h2>Builds</h2>
      <p id="builds-hint">All build jobs. Trigger new work from a <a href="/side-tags.html">side tag</a>.</p>
      <div class="form-group" style="margin-bottom:1rem;">
        <label>Filter</label>
        <input type="text" id="builds-filter" placeholder="Filter by ID, package, release, arch, status" style="padding:0.4rem; width:100%; max-width:20rem;">
      </div>
      <div class="list-toolbar">
        <div class="bulk-selection-bar" id="builds-bulk-bar">
          <span class="bulk-selection-count"></span>
          <span class="bulk-selection-buttons"></span>
        </div>
        <div class="select-all-wrap">
          <label for="builds-select-all">Select all</label>
        </div>
        <div class="pagination" id="builds-pagination">
          <button type="button" class="btn" id="builds-prev" disabled>Prev</button>
          <span class="page-info" id="builds-page-info">Page 1 of 1</span>
          <button type="button" class="btn" id="builds-next" disabled>Next</button>
          <select class="page-size" id="builds-page-size" title="Items per page">
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>
      <table class="table-list">
        <thead>
          <tr>
            <th class="col-checkbox"><input type="checkbox" id="builds-select-all" title="Select all on this page"></th>
            <th>ID</th>
            <th>Package</th>
            <th>Release</th>
            <th>Side tag</th>
            <th>Arch</th>
            <th>Status</th>
            <th>Signing</th>
            <th>Chain</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="builds-tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js?v=21"></script>
  <script>
    (function() {
      const api = window.oreonApi;
      var buildsPage = 0, buildsPageSize = 25, buildsTotal = 0;
      var RETRY_ALREADY_MESSAGE = 'This package has already been retried, if the status has not changed, it could take a little bit. If you are sure you want to retry again, reload the page and try again.';
      var retriedBuildJobIds = new Set();

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }
      function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
      function statusClass(s) {
        if (s === 'success' || s === 'skipped') return 'badge success';
        if (s === 'failed' || s === 'cancelled') return 'badge failed';
        if (s === 'running' || s === 'queued') return 'badge running';
        return 'badge pending';
      }
      function markBuildJobRetried(jobId) { retriedBuildJobIds.add(String(jobId)); }
      function isBuildJobRetried(jobId) { return retriedBuildJobIds.has(String(jobId)); }
      var buildsTableSel = window.oreonBindTableSelection(document.getElementById('builds-tbody'), {
        rowCheckboxSelector: '.build-row-cb',
        selectAll: document.getElementById('builds-select-all'),
        bulkBar: document.getElementById('builds-bulk-bar'),
        onSelectionChange: function(ids, btns) {
          var tbody = document.getElementById('builds-tbody');
          var clear = document.createElement('button');
          clear.type = 'button';
          clear.className = 'btn';
          clear.textContent = 'Clear selection';
          clear.addEventListener('click', function() {
            tbody.querySelectorAll('.build-row-cb').forEach(function(cb) { cb.checked = false; });
            buildsTableSel.refresh();
          });
          btns.appendChild(clear);
          if (!api.token) return;
          var canRetryAny = ids.some(function(id) {
            var tr = tbody.querySelector('tr[data-id="' + id + '"]');
            if (!tr || tr.getAttribute('data-side-tag') !== '1') return false;
            var st = tr.getAttribute('data-status') || '';
            return st !== 'pending' && st !== 'queued' && st !== 'running';
          });
          if (canRetryAny) {
          var retryBulk = document.createElement('button');
          retryBulk.type = 'button';
          retryBulk.className = 'btn';
          retryBulk.textContent = 'Retry selected';
          retryBulk.addEventListener('click', function() {
            var chain = Promise.resolve();
            var sawAlreadyRetried = false;
            ids.forEach(function(id) {
              var sid = String(id);
              var tr = tbody.querySelector('tr[data-id="' + sid + '"]');
              var st = tr ? (tr.getAttribute('data-status') || '')  : '-';
              if (st === 'pending' || st === 'queued' || st === 'running') return;
              if (tr && tr.getAttribute('data-side-tag') !== '1') return;
              if (isBuildJobRetried(sid)) { sawAlreadyRetried = true; return; }
              chain = chain.then(function() {
                return api.post('/builds/jobs/' + sid + '/retry').then(function() { markBuildJobRetried(sid); });
              });
            });
            if (sawAlreadyRetried) alert(RETRY_ALREADY_MESSAGE);
            chain.then(function() { render(); }).catch(function(e) { alert(e.message); });
          });
          btns.appendChild(retryBulk);
          }
          var cancelBulk = document.createElement('button');
          cancelBulk.type = 'button';
          cancelBulk.className = 'btn';
          cancelBulk.textContent = 'Cancel selected';
          cancelBulk.addEventListener('click', function() {
            var chain = Promise.resolve();
            ids.forEach(function(id) {
              var tr = tbody.querySelector('tr[data-id="' + id + '"]');
              var st = tr ? (tr.getAttribute('data-status') || '')  : '-';
              if (st !== 'pending' && st !== 'queued' && st !== 'running') return;
              chain = chain.then(function() { return api.post('/builds/jobs/' + id + '/cancel'); });
            });
            chain.then(function() { render(); }).catch(function(e) { alert(e.message); });
          });
          btns.appendChild(cancelBulk);
        }
      });

      function render() {
        var offset = buildsPage * buildsPageSize;
        var bf = document.getElementById('builds-filter');
        var bq = (bf && bf.value) ? String(bf.value).trim()  : '-';
        var buildsUrl = '/builds?limit=' + buildsPageSize + '&offset=' + offset;
        if (bq) buildsUrl += '&search=' + encodeURIComponent(bq);
        api.get(buildsUrl).then(function(data) {
          const tbody = document.getElementById('builds-tbody');
          if (!tbody) return;
          var jobs = (data && data.items) ? data.items : [];
          buildsTotal = (data && typeof data.total === 'number') ? data.total : 0;
          tbody.innerHTML = jobs.map(function(j) {
            const canAct = api.token;
            var cancelBtn = (canAct && (j.status === 'pending' || j.status === 'queued' || j.status === 'running'))
              ? ' <button type="button" class="btn cancel-build" data-id="' + j.id + '">Cancel</button>'  : '';
            var retryEligible = canAct && j.side_tag_id != null && j.side_tag_id !== undefined && j.status !== 'pending' && j.status !== 'queued' && j.status !== 'running';
            var retryUsed = retryEligible && isBuildJobRetried(j.id);
            var retryBtn = '';
            if (retryEligible) {
              retryBtn = retryUsed
                ? ' <button type="button" class="btn retry" data-id="' + j.id + '" disabled title="Reload the page to retry again">Retried</button>'
                : ' <button type="button" class="btn retry" data-id="' + j.id + '">Retry</button>';
            }
            var arch = (j.architecture != null && j.architecture !== '') ? j.architecture  : '-';
            var sd = window.oreonJobDisplayStatus ? window.oreonJobDisplayStatus(j) : String(j.status || '');
            var signCell = window.oreonSigningKeyHtml ? window.oreonSigningKeyHtml(j.signing_status)  : '-';
            var pkg = escapeHtml(j.package_name || '') + (j.package_id != null ? ' <span style="color:var(--text-muted)">(' + j.package_id + ')</span>' : '');
            var rel = escapeHtml(j.release_name || '') + (j.release_id != null ? ' <span style="color:var(--text-muted)">(' + j.release_id + ')</span>' : '');
            var sideTag = '-';
            if (j.side_tag_id != null) {
              sideTag = '<a href="/side-tag.html?id=' + j.side_tag_id + '">' + escapeHtml(j.side_tag_name || ('#' + j.side_tag_id)) + '</a>';
            } else if (j.branch) {
              sideTag = '<span style="color:var(--text-muted)">' + escapeHtml(j.branch) + '</span>';
            }
            var chainPart = '-';
            if (j.rpmbuild_plan_id != null && j.rpmbuild_plan_id !== undefined) {
              var chainIdStr = String(j.rpmbuild_plan_id);
              var idxNote = (j.rpmbuild_layer_index != null && j.rpmbuild_layer_index !== undefined)
                ? ' <span style="color:var(--text-muted); font-size:0.85em">(G' + (Number(j.rpmbuild_layer_index) + 1) + ')</span>'  : '';
              if (j.side_tag_id != null) {
                chainPart = '<a href="/side-tag.html?id=' + j.side_tag_id + '&chain_plan_id=' + chainIdStr + '">' + chainIdStr + '</a>' + idxNote;
              } else {
                chainPart = chainIdStr + idxNote;
              }
            }
            return '<tr data-id="' + j.id + '" data-status="' + escapeAttr(j.status || '') + '" data-side-tag="' + (j.side_tag_id != null ? '1' : '0') + '">' +
              '<td class="col-checkbox"><input type="checkbox" class="build-row-cb" data-id="' + j.id + '"></td>' +
              '<td>' + j.id + '</td><td>' + pkg + '</td><td>' + rel + '</td><td>' + sideTag + '</td><td>' + arch + '</td>' +
              '<td><span class="' + statusClass(sd) + '">' + escapeHtml(sd) + '</span></td>' +
              '<td>' + signCell + '</td><td style="white-space:normal; max-width:16rem;">' + chainPart + '</td>' +
              '<td>' + (j.created_at || '').slice(0, 19) + '</td>' +
              '<td><a href="/build.html?job_id=' + j.id + '">View</a>' + retryBtn + cancelBtn + '</td></tr>';
          }).join('') || '<tr><td colspan="11">No builds</td></tr>';

          tbody.querySelectorAll('.retry:not([disabled])').forEach(function(btn) {
            btn.addEventListener('click', function() {
              var jid = String(btn.dataset.id);
              if (isBuildJobRetried(jid)) { alert(RETRY_ALREADY_MESSAGE); return; }
              oreonWithLoading(btn, function() {
                return api.post('/builds/jobs/' + jid + '/retry')
                  .then(function() { markBuildJobRetried(jid); render(); })
                  .catch(function(e) { alert(e.message); });
              });
            });
          });
          tbody.querySelectorAll('.cancel-build').forEach(function(btn) {
            btn.addEventListener('click', function() {
              oreonWithLoading(btn, function() {
                return api.post('/builds/jobs/' + btn.dataset.id + '/cancel').then(render).catch(function(e) { alert(e.message); });
              });
            });
          });
          var numPages = buildsTotal ? Math.ceil(buildsTotal / buildsPageSize) : 1;
          document.getElementById('builds-page-info').textContent = 'Page ' + (buildsPage + 1) + ' of ' + numPages;
          document.getElementById('builds-prev').disabled = buildsPage <= 0;
          document.getElementById('builds-next').disabled = buildsPage >= numPages - 1;
          buildsTableSel.refresh();
        }).catch(function() {
          const tbody = document.getElementById('builds-tbody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="11">Failed to load</td></tr>';
        });
      }

      document.getElementById('builds-prev').addEventListener('click', function() {
        if (buildsPage > 0) { buildsPage--; render(); }
      });
      document.getElementById('builds-next').addEventListener('click', function() {
        var numPages = buildsTotal ? Math.ceil(buildsTotal / buildsPageSize) : 1;
        if (buildsPage < numPages - 1) { buildsPage++; render(); }
      });
      document.getElementById('builds-page-size').addEventListener('change', function() {
        buildsPageSize = parseInt(this.value, 10) || 25;
        buildsPage = 0;
        render();
      });
      var bff = document.getElementById('builds-filter');
      if (bff && window.oreonPrefillUrlSearch) window.oreonPrefillUrlSearch('builds-filter');
      if (bff && window.oreonDebounce) {
        bff.addEventListener('input', window.oreonDebounce(function() { buildsPage = 0; render(); }, 300));
      }
      function updateHint() {
        var hint = document.getElementById('builds-hint');
        if (!hint) return;
        hint.innerHTML = api.token
          ? 'All build jobs. Trigger new work from a <a href="/side-tags.html">side tag</a>.'
          : 'All build jobs. Login to retry/cancel. Trigger from a <a href="/side-tags.html">side tag</a>.';
      }
      updateHint();
      window.addEventListener('auth-change', function() { updateHint(); render(); });
      render();
    })();
  </script>
</body>
</html>
