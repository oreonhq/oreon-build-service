<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build - Oreon Build Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/static/style.css?v=29">
  <style>
    .build-meta { margin-bottom: 1rem; }
    .build-meta dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; }
    .build-meta dt { color: var(--text-muted); }
    .attempt-card { margin-bottom: 1rem; border: none; border-radius: 10px; padding: 0.75rem; }
    .attempt-card h4 { margin: 0 0 0.5rem 0; }
    .log-placeholder { color: var(--text-muted); font-style: italic; }
    .log-group { margin-top: 0.55rem; }
    .log-group-name { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 0.15rem; }
    .log-link { display: inline-block; margin: 0.15rem 0.85rem 0.15rem 0; }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo-link"><img src="/static/obslogo.png" alt="Oreon Build Service" class="header-logo" /></a>
    <nav></nav>
  </header>
  <main class="main">
    <section class="card">
      <h2>Build <span id="job-id">---</span></h2>
      <div id="build-loading" class="build-meta">Loading</div>
      <div id="build-meta" class="build-meta" style="display:none;"></div>
      <div id="build-error" style="display:none; color: var(--danger, #c00);"></div>
      <h3 style="margin-top:1.5rem;">Attempts</h3>
      <div id="attempts-list"></div>
    </section>
  </main>
  <script src="/static/app.js?v=31"></script>
  <script>
    (function() {
      const api = window.oreonApi;
      function getJobId() {
        var params = new URLSearchParams(window.location.search);
        return params.get('job_id') || '';
      }
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function escapeAttr(s) { return escapeHtml(s || '').replace(/"/g, '&quot;'); }
      function statusClass(s) {
        if (s === 'success' || s === 'skipped') return 'badge success';
        if (s === 'failed' || s === 'cancelled') return 'badge failed';
        if (s === 'running' || s === 'queued') return 'badge running';
        return 'badge pending';
      }
      function formatElapsed(ms) {
        if (ms == null || ms < 0 || !isFinite(ms)) return '---';
        var sec = Math.floor(ms / 1000);
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        if (h > 0) return h + 'h ' + m + 'm';
        if (m > 0) return m + 'm ' + s + 's';
        return s + 's';
      }
      var LOG_POLL_MS = 15000;
      function stopLogPoll() {
        if (window.__oreonLogPollTimer) {
          clearInterval(window.__oreonLogPollTimer);
          window.__oreonLogPollTimer = null;
        }
      }
      function logFileHref(attemptId, name) {
        var parts = String(name).split('/').map(function(p) { return encodeURIComponent(p); }).join('/');
        return '/api/logs/attempts/' + encodeURIComponent(attemptId) + '/files/' + parts;
      }
      function renderLogLinks(attemptId, files) {
        var html = '<a class="log-link" target="_blank" rel="noopener" href="/api/logs/attempts/' + encodeURIComponent(attemptId) + '">log</a>';
        var groups = {};
        var order = [];
        (files || []).forEach(function(f) {
          var name = String((f && f.name) || '');
          if (!name) return;
          var slash = name.indexOf('/');
          var group = slash >= 0 ? name.slice(0, slash) : 'logs';
          var label = slash >= 0 ? name.slice(slash + 1) : name;
          if (!groups[group]) {
            groups[group] = [];
            order.push(group);
          }
          groups[group].push({ label: label, name: name });
        });
        order.forEach(function(group) {
          html += '<div class="log-group"><div class="log-group-name">' + escapeHtml(group) + '</div>';
          groups[group].forEach(function(item) {
            html += '<a class="log-link" target="_blank" rel="noopener" href="' + logFileHref(attemptId, item.name) + '">' + escapeHtml(item.label) + '</a>';
          });
          html += '</div>';
        });
        return html;
      }
      function paintLogs(attemptId, host) {
        if (!host) return Promise.resolve();
        return api.get('/logs/attempts/' + attemptId + '/files').then(function(r) {
          host.innerHTML = renderLogLinks(attemptId, (r && r.files) || []);
        }).catch(function() {
          host.innerHTML = renderLogLinks(attemptId, []);
        });
      }
      function startLogPoll(container) {
        stopLogPoll();
        if (!container) return;
        window.__oreonLogPollTimer = setInterval(function() {
          var live = false;
          container.querySelectorAll('.attempt-card').forEach(function(card) {
            var st = (card.getAttribute('data-attempt-status') || '').toLowerCase();
            if (st !== 'running' && st !== 'queued') return;
            live = true;
            paintLogs(card.getAttribute('data-attempt-id'), card.querySelector('.attempt-logs'));
          });
          if (!live) stopLogPoll();
        }, LOG_POLL_MS);
      }
      function refreshAttemptElapsed(container) {
        if (!container) return;
        var now = Date.now();
        container.querySelectorAll('.attempt-card').forEach(function(card) {
          var st = card.getAttribute('data-attempt-status') || '';
          var started = card.getAttribute('data-started-at') || '';
          var el = card.querySelector('.attempt-elapsed-live');
          if (!el) return;
          if (st !== 'running' && st !== 'queued') {
            el.textContent = '';
            el.style.display = 'none';
            return;
          }
          var t0 = Date.parse(started);
          if (isNaN(t0)) {
            el.textContent = '';
            return;
          }
          el.style.display = '';
          el.innerHTML = '<small>Elapsed (wall clock): ' + escapeHtml(formatElapsed(now - t0)) + '</small>';
        });
      }
      function loadBuild() {
        var jobId = getJobId();
        if (!jobId) {
          document.getElementById('build-loading').style.display = 'none';
          document.getElementById('build-error').style.display = 'block';
          document.getElementById('build-error').textContent = 'Missing job_id in URL.';
          return;
        }
        document.getElementById('job-id').textContent = '#' + jobId;
        Promise.all([
          api.get('/builds/jobs/' + jobId),
          api.get('/packages?limit=500').catch(function() { return { items: [] }; }),
          api.get('/releases?limit=500').catch(function() { return { items: [] }; })
        ]).then(function(results) {
          var job = results[0];
          var packages = (results[1] && results[1].items) ? results[1].items : [];
          var releases = (results[2] && results[2].items) ? results[2].items : [];
          document.getElementById('build-loading').style.display = 'none';
          document.getElementById('build-meta').style.display = 'block';
          var pkg = packages.find(function(p) { return p.id === job.package_id; });
          var rel = releases.find(function(r) { return r.id === job.release_id; });
          var pkgName = (job.package_name || '').trim() || ((pkg && pkg.name) ? String(pkg.name).trim() : '');
          var relName = (job.release_name || '').trim() || ((rel && rel.releasename) ? String(rel.releasename).trim() : '');
          var pkgLabel = pkgName ? escapeHtml(pkgName) + ' (' + job.package_id + ')' : ('#' + (job.package_id || '---'));
          var relLabel = relName ? escapeHtml(relName) + ' (' + job.release_id + ')' : ('#' + (job.release_id || '---'));
          var jobDisp = window.oreonJobDisplayStatus ? window.oreonJobDisplayStatus(job) : String(job.status || '');
          var meta = document.getElementById('build-meta');
          var signingRow = window.oreonSigningKeyHtml
            ? '<dt>Signing</dt><dd>' + window.oreonSigningKeyHtml(job.signing_status) + '</dd>'
            : '';
          meta.innerHTML = '<dl><dt>Package</dt><dd>' + pkgLabel + '</dd>' +
            '<dt>Release</dt><dd>' + relLabel + '</dd>' +
            '<dt>Architecture</dt><dd>' + escapeHtml(job.architecture || '---') + '</dd>' +
            '<dt>Status</dt><dd>' + (window.oreonStatusIcon ? window.oreonStatusIcon(jobDisp) : escapeHtml(jobDisp)) + '</dd>' +
            signingRow +
            '<dt>Created</dt><dd>' + (job.created_at || '').slice(0, 19) + '</dd>' +
            '<dt>Completed</dt><dd>' + (job.completed_at ? job.completed_at.slice(0, 19) : '---') + '</dd></dl>' +
            '<div id="scan-box"></div>';
          var scanBox = document.getElementById('scan-box');
          if (scanBox && job.scan_state === 'quarantined') {
            scanBox.innerHTML = '<p style="margin:0.75rem 0 0"><button type="button" class="btn" id="btn-disregard">Disregard</button></p><div id="scan-hits"></div>';
            api.get('/builds/jobs/' + job.id + '/scan-findings').then(function(rows) {
              var host = document.getElementById('scan-hits');
              if (!host) return;
              var list = Array.isArray(rows) ? rows : [];
              host.innerHTML = list.map(function(hit) {
                return '<div style="margin-top:0.35rem"><a href="/security-finding.html?id=' + encodeURIComponent(hit.id) + '">' + escapeHtml((hit.rule || '') + ' ' + (hit.file_path || '')) + '</a></div>';
              }).join('');
            }).catch(function() {});
            var disregard = document.getElementById('btn-disregard');
            if (disregard) disregard.onclick = function() {
              if (!api.token) { alert('Login required'); return; }
              oreonWithLoading(disregard, function() {
                return api.post('/builds/jobs/' + job.id + '/disregard-scan', {}).then(function() { loadBuild(); });
              });
            };
          }
          return api.get('/builds/jobs/' + jobId + '/attempts');
        }).then(function(attempts) {
          var list = Array.isArray(attempts) ? attempts : [];
          var container = document.getElementById('attempts-list');
          if (!list.length) {
            container.innerHTML = '<p class="log-placeholder">No attempts yet.</p>';
            return;
          }
          container.innerHTML = list.map(function(a, idx) {
            var st = (a.status || '').toLowerCase();
            var adisp = window.oreonJobDisplayStatus
              ? window.oreonJobDisplayStatus({ display_status: a.display_status, status: a.status })
              : st;
            var signingLine = window.oreonSigningKeyHtml
              ? '<div style="margin-top:0.35rem">' + window.oreonSigningKeyHtml(a.signing_status) + '</div>'
              : '';
            var workerLine = '';
            if (a.worker_name || a.worker_id) {
              var who = a.worker_name ? escapeHtml(a.worker_name) : ('#' + a.worker_id);
              var hb = a.worker_last_heartbeat ? a.worker_last_heartbeat.slice(0, 19) : '---';
              workerLine = '<div><small>Worker: ' + who + ' &nbsp; Last heartbeat (UTC): ' + hb + '</small></div>';
            }
            return '<div class="attempt-card" data-attempt-id="' + a.id + '" data-attempt-status="' + escapeAttr(st) + '" data-started-at="' + escapeAttr(a.started_at || '') + '">' +
              '<h4>Attempt #' + (a.attempt_number || (idx + 1)) + ' ' + (window.oreonStatusIcon ? window.oreonStatusIcon(adisp) : escapeHtml(adisp)) + '</h4>' +
              signingLine +
              workerLine +
              '<div class="attempt-elapsed-live" style="color:var(--text-muted);"></div>' +
              '<div><small>Started: ' + (a.started_at ? a.started_at.slice(0, 19) : '---') + ' &nbsp; Finished: ' + (a.finished_at ? a.finished_at.slice(0, 19) : '---') + '</small></div>' +
              '<div class="artifacts" id="artifacts-' + a.id + '" style="margin-top:0.5rem; font-size:0.9rem; color:var(--text-muted);">Artifacts: loading</div>' +
              '<div class="attempt-logs" id="logs-' + a.id + '" style="margin-top:0.5rem;">' + renderLogLinks(a.id, []) + '</div>' +
              '</div>';
          }).join('');
          refreshAttemptElapsed(container);
          if (window.__oreonBuildElapsedTimer) clearInterval(window.__oreonBuildElapsedTimer);
          window.__oreonBuildElapsedTimer = setInterval(function() { refreshAttemptElapsed(container); }, 30000);
          list.forEach(function(a) {
            paintLogs(a.id, document.getElementById('logs-' + a.id));
          });
          startLogPoll(container);
          // Load artifacts (including signing status) for each attempt
          list.forEach(function(a) {
            var placeholder = document.getElementById('artifacts-' + a.id);
            if (!placeholder) return;
            api.get('/builds/attempts/' + a.id + '/artifacts').then(function(arts) {
              var arr = Array.isArray(arts) ? arts : [];
              if (!arr.length) {
                placeholder.textContent = 'Artifacts: none';
                return;
              }
              var rows = arr.map(function(ar) {
                var signed = ar.is_signed ? 'Yes' : 'No';
                return '<tr><td>' + escapeHtml(ar.filename || '') + '</td><td>' + signed + '</td></tr>';
              }).join('');
              placeholder.innerHTML = '<table class="table-compact"><thead><tr><th>Name</th><th>Signed</th></tr></thead><tbody>' + rows + '</tbody></table>';
              placeholder.style.color = '';
            }).catch(function() {
              placeholder.textContent = 'Artifacts: failed to load';
            });
          });
        }).catch(function(e) {
          document.getElementById('build-loading').style.display = 'none';
          document.getElementById('build-error').style.display = 'block';
          document.getElementById('build-error').textContent = 'Failed to load build: ' + (e.message || e);
        });
      }
      loadBuild();
    })();
  </script>
</body>
</html>
